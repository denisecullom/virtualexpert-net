# Netlify config for virtualexpert.net
# Plain static site: no build step, publish the repo root.
[build]
  publish = "."
  command = ""

# Send the www subdomain to the main domain
[[redirects]]
  from = "https://www.virtualexpert.net/*"
  to = "https://virtualexpert.net/:splat"
  status = 301
  force = true

# The AI Client Kit is now included with the Playbook on /guide
[[redirects]]
  from = "/templates"
  to = "/guide#kit"
  status = 301

# Basic security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache images, CSS and JS for a day
[[headers]]
  for = "/*.(css|js|jpg|svg)"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Keep purchase pages and product files out of search engines
[[headers]]
  for = "/thanks/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/files/*"
  [headers.values]
    X-Robots-Tag = "noindex"
